<link rel="stylesheet" href="{{ url_for('views.themes', theme='cyberpunk', path='cyberpunk/landing.css') }}&v=3">

<section class="lp-hero" id="lp-hero">
  <canvas class="lp-canvas" id="lp-canvas" aria-hidden="true"></canvas>

  <div class="lp-hero-inner container">
    <img class="lp-logo" src="{{ url_for('views.themes', theme='cyberpunk', path='cyberpunk/logo.svg') }}" alt="Neon eye logo" draggable="false">

    <p class="lp-eyebrow">Wake up, samurai</p>
    <h1 class="lp-title">{{ Configs.ctf_name }}</h1>
    <p class="lp-sub">Capture the flag in Night City. Jack in, crack the ICE, and climb the leaderboard before the corps trace you.</p>

    <div class="lp-cta">
      {% if authed() %}
        <a class="lp-btn lp-btn-primary" href="{{ url_for('challenges.listing') }}">Play challenges</a>
        <a class="lp-btn" href="{{ url_for('scoreboard.listing') }}">Scoreboard</a>
      {% else %}
        {% if registration_visible() %}
          <a class="lp-btn lp-btn-primary" href="{{ url_for('auth.register') }}">Jack in</a>
        {% endif %}
        <a class="lp-btn lp-btn-ghost" href="{{ url_for('scoreboard.listing') }}">Scoreboard</a>
      {% endif %}
    </div>

    <p class="lp-countdown" id="lp-countdown" hidden></p>
  </div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="lp-tower" viewBox="0 0 80 190">
      <path d="M8 190V50l12-10V20l8-8h24l8 8v20l12 10v140z" fill="#0d0820" stroke="#2c1a5e" stroke-width="2"/>
      <path d="M40 12V0" stroke="#ff2a9d" stroke-width="3"/><circle cx="40" cy="0" r="3" fill="#ff2a9d"/>
      <g fill="#00f0ff"><rect x="18" y="62" width="8" height="6"/><rect x="34" y="62" width="8" height="6" fill="#fcee0a"/><rect x="50" y="62" width="8" height="6"/><rect x="18" y="82" width="8" height="6" fill="#ff2a9d"/><rect x="50" y="82" width="8" height="6" fill="#fcee0a"/><rect x="34" y="102" width="8" height="6"/><rect x="18" y="122" width="8" height="6" fill="#fcee0a"/><rect x="50" y="122" width="8" height="6" fill="#ff2a9d"/><rect x="34" y="142" width="8" height="6" fill="#00f0ff"/><rect x="18" y="162" width="8" height="6"/><rect x="50" y="162" width="8" height="6" fill="#fcee0a"/></g>
      <path d="M8 50l12-10M72 50L60 40" stroke="#00f0ff" stroke-width="2"/>
    </symbol>
    <symbol id="lp-sign" viewBox="0 0 80 150">
      <path d="M40 150V60" stroke="#2c1a5e" stroke-width="5"/>
      <rect x="6" y="8" width="68" height="54" rx="3" fill="#0d0820" stroke="#ff2a9d" stroke-width="3"/>
      <text x="40" y="32" text-anchor="middle" font-family="Orbitron,Arial" font-weight="700" font-size="14" fill="#00f0ff">RAMEN</text>
      <text x="40" y="52" text-anchor="middle" font-family="Orbitron,Arial" font-weight="700" font-size="13" fill="#fcee0a">24/7</text>
    </symbol>
    <symbol id="lp-plane" viewBox="0 0 330 80">
      <path d="M168 40l30 2" stroke="#00f0ff" stroke-width="2" stroke-dasharray="3 4"/>
      <rect x="4" y="22" width="164" height="30" rx="2" fill="#0d0820" stroke="#00f0ff" stroke-width="2"/>
      <text x="86" y="43" text-anchor="middle" font-family="Orbitron,Arial" font-weight="700" font-size="13" letter-spacing=".5" fill="#00f0ff">HACK THE PLANET</text>
      <g transform="translate(130 0)">
        <path d="M68 46l20-14h58c12 0 22 6 26 14v8H68z" fill="#ff2a9d"/>
        <path d="M96 34l16-10h26l8 10z" fill="#8ff7ff" opacity=".85"/>
        <path d="M80 54h92" stroke="#fcee0a" stroke-width="3"/>
        <path d="M70 58h108" stroke="#00f0ff" stroke-width="4" opacity=".6" filter="url(#n)"/>
        <circle cx="94" cy="62" r="6" fill="#12001a" stroke="#00f0ff" stroke-width="2"/><circle cx="154" cy="62" r="6" fill="#12001a" stroke="#00f0ff" stroke-width="2"/>
        <path d="M186 44l10 2-10 4z" fill="#fcee0a"/>
      </g>
    </symbol>
    <filter id="n"><feGaussianBlur stdDeviation="3"/></filter>
  </svg>
  <div class="lp-flock-lane" aria-hidden="true">
    <div class="lp-flock" style="--d:0s;--y:0px;--dur:24s">
      <svg class="lp-witch"><use href="#lp-plane"/></svg>
    </div>
    <div class="lp-flock lp-flock-b" style="--d:-13s;--y:26px;--dur:30s">
      <span class="lp-bat" style="--o:-130px;--bd:.2s">🛸</span>
      <span class="lp-bat" style="--o:-85px;--bd:.5s">👾</span>
      <span class="lp-bat" style="--o:-40px;--bd:.8s;font-size:1.4rem">⚡</span>
    </div>
  </div>
  <div class="lp-snowmen" aria-hidden="true">
    <svg class="lp-snowman" style="left:3%;--s:1.15"><use href="#lp-tower"/></svg>
    <svg class="lp-snowman" style="left:11%;--s:.8;--bd:-1.5s"><use href="#lp-sign"/></svg>
    <svg class="lp-snowman" style="right:4%;--s:1.3;--bd:-.7s"><use href="#lp-tower"/></svg>
    <svg class="lp-snowman" style="right:13%;--s:.75;--bd:-2s"><use href="#lp-sign"/></svg>
    <span class="lp-crab" style="left:30%">🤖</span><span class="lp-crab" style="right:28%;--cd:-2s">🔌</span>
    <div class="lp-drift"></div>
  </div>
</section>
