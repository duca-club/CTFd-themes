<link rel="stylesheet" href="{{ url_for('views.themes', theme='summer', path='summer/landing.css') }}&v=1">

<section class="lp-hero" id="lp-hero">
  <canvas class="lp-canvas" id="lp-canvas" aria-hidden="true"></canvas>

  <div class="lp-hero-inner container">
    <img class="lp-logo" src="{{ url_for('views.themes', theme='summer', path='summer/sun.svg') }}" alt="Sun wearing sunglasses" draggable="false">

    <p class="lp-eyebrow">Sun's out, hackers out</p>
    <h1 class="lp-title">{{ Configs.ctf_name }}</h1>
    <p class="lp-sub">Capture the flag, beach edition. Grab a challenge, catch a wave, ride the scoreboard to the top.</p>

    <div class="lp-cta">
      {% if authed() %}
        <a class="lp-btn lp-btn-primary" href="{{ url_for('challenges.listing') }}">Play challenges</a>
        <a class="lp-btn" href="{{ url_for('scoreboard.listing') }}">Scoreboard</a>
      {% else %}
        {% if registration_visible() %}
          <a class="lp-btn lp-btn-primary" href="{{ url_for('auth.register') }}">Dive in</a>
        {% endif %}
        <a class="lp-btn lp-btn-ghost" href="{{ url_for('scoreboard.listing') }}">Scoreboard</a>
      {% endif %}
    </div>

    <p class="lp-countdown" id="lp-countdown" hidden></p>
  </div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="lp-palm" viewBox="0 0 120 180">
      <path d="M58 176c2-40 0-80-8-120h12c8 40 8 80 6 120z" fill="#8a5a2b"/>
      <path d="M50 70l14-4M52 96l12-4M54 122l10-4M56 148l8-3" stroke="#6b431c" stroke-width="3"/>
      <path d="M58 56C40 30 14 34 2 52c22-6 38 0 56 4z" fill="#2fbf71"/>
      <path d="M58 56C46 24 66 6 90 8c-16 10-22 28-32 48z" fill="#27a862"/>
      <path d="M58 56c22-18 50-14 62 4-22-6-42-4-62-4z" fill="#2fbf71"/>
      <path d="M58 56C34 50 14 66 12 84c18-14 30-22 46-28z" fill="#27a862"/>
      <path d="M58 56c20 8 40 26 40 44-12-16-26-30-40-44z" fill="#1f9d57"/>
      <circle cx="56" cy="60" r="6" fill="#6b431c"/><circle cx="66" cy="62" r="6" fill="#7a4a21"/>
    </symbol>
    <symbol id="lp-umbrella" viewBox="0 0 140 150">
      <rect x="67" y="40" width="6" height="108" rx="3" fill="#e5e7eb"/>
      <path d="M6 56C14 14 126 14 134 56z" fill="#ff6b6b"/>
      <path d="M6 56C20 14 50 14 46 56zM94 56C90 14 120 14 134 56z" fill="#fff6e0"/>
      <path d="M46 56C48 14 92 14 94 56z" fill="#ffd23f"/>
      <path d="M6 56q16 10 32 0q16 10 32 0q16 10 32 0q16 10 32 0" fill="none" stroke="#fff6e0" stroke-width="3" opacity=".6"/>
    </symbol>
    <symbol id="lp-plane" viewBox="0 0 310 80">
      <path d="M150 38l28 3" stroke="#fff6e0" stroke-width="2" stroke-dasharray="3 4"/>
      <rect x="4" y="24" width="148" height="28" rx="4" fill="#fff6e0"/><rect x="4" y="24" width="148" height="28" rx="4" fill="none" stroke="#ff6b6b" stroke-width="2"/>
      <text x="78" y="45" text-anchor="middle" font-family="Archivo,Arial" font-weight="800" font-size="17" letter-spacing="1" fill="#ff6b6b">SUMMER CTF</text>
      <g transform="translate(110 0)">
        <path d="M68 40c0-8 8-12 40-12h38c10 0 18 6 18 12s-8 12-18 12h-38c-32 0-40-4-40-12z" fill="#ff9f1c"/>
        <path d="M146 28l16-14h8l-8 16z" fill="#c2410c"/>
        <path d="M86 28c10-8 24-8 34 0z" fill="#7fe9f5"/>
        <path d="M92 52V68M122 52V68" stroke="#14202e" stroke-width="3"/><path d="M82 70h50" stroke="#14202e" stroke-width="3" stroke-linecap="round"/>
        <path d="M88 24h52" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>
        <path d="M170 36l14 4-14 4z" fill="#14202e"/>
      </g>
    </symbol>
  </svg>
  <div class="lp-flock-lane" aria-hidden="true">
    <div class="lp-flock" style="--d:0s;--y:0px;--dur:24s">
      <svg class="lp-witch"><use href="#lp-plane"/></svg>
    </div>
    <div class="lp-flock lp-flock-b" style="--d:-13s;--y:26px;--dur:30s">
      <span class="lp-bat" style="--o:-130px;--bd:.2s;--f:-1">🕊️</span>
      <span class="lp-bat" style="--o:-85px;--bd:.5s;--f:-1">🕊️</span>
      <span class="lp-bat" style="--o:-40px;--bd:.8s;font-size:1.4rem">🪁</span>
    </div>
  </div>
  <div class="lp-snowmen" aria-hidden="true">
    <svg class="lp-snowman" style="left:3%;--s:1.05"><use href="#lp-palm"/></svg>
    <svg class="lp-snowman" style="left:12%;--s:.8;--bd:-1.5s"><use href="#lp-umbrella"/></svg>
    <svg class="lp-snowman" style="right:4%;--s:1.15;--bd:-.7s;transform:scaleX(-1)"><use href="#lp-palm"/></svg>
    <svg class="lp-snowman" style="right:13%;--s:.75;--bd:-2s"><use href="#lp-umbrella"/></svg>
    <span class="lp-crab" style="left:30%">🦀</span><span class="lp-crab" style="right:28%;--cd:-2s">🐚</span>
    <div class="lp-drift"></div>
  </div>
</section>
